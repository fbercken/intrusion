apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "room-intrusion-detector.fullname" . }}
  labels:
    app: {{ include "room-intrusion-detector.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "room-intrusion-detector.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "room-intrusion-detector.fullname" . }}
    spec:
      containers:
        - name: room-intrusion-detector
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
          # Ensure correct uvicorn command format without .py
          args: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
          env:
            - name: CAMERA_STREAM_URL
              value: "http://127.0.0.1:9000/video"
          envFrom:
            - configMapRef:
                name: {{ include "room-intrusion-detector.fullname" . }}-config
            - secretRef:
                name: {{ include "room-intrusion-detector.fullname" . }}-s3-secret
          resources:
            {{- toYaml .Values.resources | nindent 12 -}}
