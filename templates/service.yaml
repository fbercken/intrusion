apiVersion: v1
kind: Service
metadata:
  name: {{ include "intrusion.fullname" . }}-service
  labels:
    app: {{ include "intrusion.fullname" . }}
spec:
  type: ClusterIP
  selector:
    app: {{ include "intrusion.fullname" . }}
  ports:
    - protocol: TCP
      port: 80         # Port exposed internally to the cluster
      targetPort: 8000 # Port FastAPI/Uvicorn is listening on