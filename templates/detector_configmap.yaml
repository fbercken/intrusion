apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "intrusion.fullname" . }}-detector-config
data:
  ROOM_NAME: {{ .Values.env.roomName | quote }}
  CAMERA_RTSP_URL: {{ .Values.env.cameraRTSPUrl | quote }}
  KAFKA_BOOTSTRAP_SERVERS: {{ .Values.detector.kafka.bootstrapServers | quote }}
  KAFKA_TOPIC: {{ .Values.detector.kafka.topic | quote }}
  CONFIDENCE_THRESHOLD: {{ .Values.env.confidenceThreshold | quote }}